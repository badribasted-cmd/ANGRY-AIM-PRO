name: Build ANGRY AIM PRO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Place Java files
        run: |
          mkdir -p app/src/main/java/com/angryaim/pro
          cp MainActivity.java OverlayService.java app/src/main/java/com/angryaim/pro/

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Angry-Aim-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
